name: Build Easy Video Downloader (Windows .exe and Android .apk)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the download on the Releases page

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Build PyInstaller's launcher from source instead of using the shared prebuilt one.
      # Antivirus tools often flag the prebuilt launcher because malware reuses it.
      - name: Install PyInstaller (launcher compiled from source)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install --no-binary pyinstaller --no-cache-dir pyinstaller
      - name: Check the program loads on Windows
        run: python -c "import easy_video_downloader as m; print(m.APP_NAME, m.YTDLP_URL)"
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "Easy Video Downloader" --icon icon.ico --add-data "icon.ico;."
          --version-file version_info.txt --noupx
          easy_video_downloader.py
      - name: Give the file a link-friendly name
        run: Copy-Item "dist/Easy Video Downloader.exe" "dist/Easy-Video-Downloader.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Easy-Video-Downloader-Windows
          path: dist/Easy-Video-Downloader.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the APK
        run: ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}
      - name: Give the file a link-friendly name
        run: cp app/build/outputs/apk/release/app-release.apk Easy-Video-Downloader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Easy-Video-Downloader-Android
          path: android/Easy-Video-Downloader.apk
          if-no-files-found: error

  # Publish one release with both files, so these permanent links always serve the newest build:
  # https://github.com/<owner>/<repo>/releases/latest/download/Easy-Video-Downloader.exe
  # https://github.com/<owner>/<repo>/releases/latest/download/Easy-Video-Downloader.apk
  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Easy Video Downloader (build ${{ github.run_number }})
          body: |
            **Windows:** download **Easy-Video-Downloader.exe** below and double-click it. No installation or Python needed.
            If Windows says "Windows protected your PC", click **More info -> Run anyway**.

            **Android:** download **Easy-Video-Downloader.apk** on your phone, open it and tap **Install**.
            If your phone asks, allow your browser to install unknown apps.

            Step-by-step help: [User Guide](https://github.com/${{ github.repository }}/blob/main/USER_GUIDE.md)
          files: |
            out/Easy-Video-Downloader.exe
            out/Easy-Video-Downloader.apk
          make_latest: true
          fail_on_unmatched_files: true
